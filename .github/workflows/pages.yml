name: Homepage

# Publish server/ to GitHub Pages.
#
# The homepage is one static HTML file with no build step, so this uploads the folder as
# it stands. It redeploys only when that folder actually changes — the page does not
# depend on the app's source, and rebuilding it on every commit to main would just make
# the deploy history unreadable.
#
# ONE-TIME SETUP, and it genuinely cannot be automated:
#
#   Settings > Pages > Build and deployment > Source: GitHub Actions
#
# Creating a Pages site for the first time is an admin-level operation, and GITHUB_TOKEN
# is an installation token that does not carry repository-admin rights however generous
# the `permissions:` block below is. `actions/configure-pages` has an `enablement: true`
# input that tries anyway; on this repo it fails with
#   "Create Pages site failed. Error: Resource not accessible by integration"
# which is the ceiling being enforced, not a misconfiguration. So the switch gets flipped
# once by a human with admin on the repo, and every run after that just works.

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and do not cancel one half-done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the page is missing
        run: test -f server/index.html || { echo "::error::server/index.html not found"; exit 1; }

      # Fails until Pages is enabled by hand, once — see the note at the top.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: server

      - id: deployment
        uses: actions/deploy-pages@v4
