name: Release

# Build the installers and ship them, without anyone having to remember a command.
#
# Bump "version" in package.json, merge to main, and this releases it: tests, build,
# npm publish, then a GitHub Release with watsmytask-installer.zip attached. Merges that
# do not touch the version do nothing — the check is whether a release already exists for
# the version in package.json, so the whole thing is idempotent and safe to re-run.
#
# Pushing a v* tag does the same, for when a release should be cut from an exact commit.
#
# ONE job with linear steps rather than several, because the order carries a guarantee:
# the installers inside the zip run `npm install watsmytask@latest`, so npm has to have
# the new version BEFORE the release advertising it exists. As separate jobs that becomes
# a needs: graph nobody re-reads; here it is just the order of the steps.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    # A dry run: builds and attaches the zip to the run, releases nothing.

permissions:
  contents: write   # create the tag, the release, and upload its asset

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, so an existing release is actually visible

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Work out whether there is anything to release, and say so in the log. Everything
      # downstream reads `should_release` rather than re-deriving this.
      - id: decide
        name: Decide whether to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Manual run: building only, releasing nothing."
            exit 0
          fi

          # A tag push must agree with package.json, or the release would carry a version
          # that is not the one inside the package.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION."
              echo "Bump package.json to ${GITHUB_REF_NAME#v}, or tag $TAG instead."
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — nothing to do."
            echo "To ship something new, bump the version in package.json."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Will release $TAG."
          fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build the installer zip
        run: ./setup/build-release.sh

      - name: Pack the npm tarball
        run: npm pack --pack-destination release

      # Kept on every run, released or not — this is what makes a manual run a useful
      # dry run, and what lets you inspect a build that decided not to release.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watsmytask-${{ steps.decide.outputs.version }}
          path: release/
          retention-days: 14

      # --- past here only when there is genuinely a new version --------------------

      - name: Publish to npm
        if: steps.decide.outputs.should_release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN is not set — skipping the npm publish."
            echo "The installers fetch watsmytask@latest, so they will keep installing the"
            echo "previously published version until this one is published by hand."
            exit 0
          fi
          if npm view "watsmytask@$VERSION" version >/dev/null 2>&1; then
            echo "watsmytask@$VERSION is already on npm — nothing to publish."
            exit 0
          fi
          npm publish --access public

      - name: Create the release
        if: steps.decide.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.decide.outputs.version }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail

          # The asset name is stable on purpose. The homepage links to
          # /releases/latest/download/watsmytask-installer.zip, which GitHub only
          # resolves while the asset is named exactly that.
          if [ ! -f release/watsmytask-installer.zip ]; then
            echo "::error::release/watsmytask-installer.zip is missing."
            exit 1
          fi

          NOTES=".github/release-notes.md"
          if [ -f "$NOTES" ]; then
            sed "s/__VERSION__/$VERSION/g" "$NOTES" > /tmp/notes.md
          else
            echo "watsmytask $VERSION" > /tmp/notes.md
          fi

          # --target creates the tag at this commit when it does not already exist,
          # which is what makes the merge-to-main path work without a manual tag.
          gh release create "$TAG" \
            --title "watsmytask $VERSION" \
            --notes-file /tmp/notes.md \
            --target "$GITHUB_SHA" \
            release/watsmytask-installer.zip

          echo "Released $TAG"
          echo "Installer: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/watsmytask-installer.zip"
