name: Release

# Build the installers and ship them, without anyone having to remember a command.
#
# Bump "version" in package.json, merge to main, and this releases it: tests, build,
# npm publish, then a GitHub Release with watsmytask-installer.zip attached. Merges that
# do not touch the version do nothing — the check is whether a release already exists for
# the version in package.json, so the whole thing is idempotent and safe to re-run.
#
# Pushing a v* tag does the same, for when a release should be cut from an exact commit.
# Running it by hand builds everything and releases nothing unless the "release" box is
# ticked, so there is a way to inspect a build before committing to a version — and a way
# to retry a release that failed for a reason outside this repository.
#
# npm is published to with TRUSTED PUBLISHING: no token, no secret. The job mints a
# short-lived OIDC token that npm verifies against a publisher configured on the package,
# and npm attaches a provenance attestation saying which workflow at which commit built
# it. That configuration names this file, so renaming release.yml breaks publishing until
# the setting on npmjs.com is renamed to match.
#
# ONE job with linear steps rather than several, because the order carries a guarantee:
# the installers inside the zip run `npm install watsmytask@latest`, so npm has to have
# the new version BEFORE the release advertising it exists. As separate jobs that becomes
# a needs: graph nobody re-reads; here it is just the order of the steps.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish to npm and create the release. Leave off for a dry run.'
        type: boolean
        default: false

permissions:
  contents: write   # create the tag, the release, and upload its asset
  id-token: write   # mint the OIDC token npm trusted publishing authenticates with

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, so an existing release is actually visible

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Deliberately NO registry-url. It looks harmless, but it makes setup-node write
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # into .npmrc — and with no token in the environment npm sends that as an *empty*
          # credential rather than falling through to OIDC. The registry then answers a
          # publish with 404, which reads like the package is missing rather than like an
          # auth failure. registry.npmjs.org is the default anyway, so there is nothing to
          # set here.

      - name: Install dependencies
        run: npm ci

      # Work out whether there is anything to release, and say so in the log. Everything
      # downstream reads `should_release` rather than re-deriving this.
      - id: decide
        name: Decide whether to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release }}" != "true" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Manual run without the release box ticked: building only."
            exit 0
          fi

          # A tag push must agree with package.json, or the release would carry a version
          # that is not the one inside the package.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION."
              echo "Bump package.json to ${GITHUB_REF_NAME#v}, or tag $TAG instead."
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — nothing to do."
            echo "To ship something new, bump the version in package.json."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Will release $TAG."
          fi

      # Cheap, and catches a broken `run:` block here rather than three minutes into a
      # release. YAML validity says nothing about the shell inside a block scalar.
      - name: Check the workflows' own shell
        run: npm run check:workflows

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build the installer zip
        run: ./setup/build-release.sh

      - name: Pack the npm tarball
        run: npm pack --pack-destination release

      # Kept on every run, released or not — this is what makes a manual run a useful
      # dry run, and what lets you inspect a build that decided not to release.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watsmytask-${{ steps.decide.outputs.version }}
          path: release/
          retention-days: 14

      # --- past here only when there is genuinely a new version --------------------

      # Trusted publishing needs npm 11.5.1 or newer, and Node 22 ships npm 10. Pinned to
      # a major rather than @latest so a new npm major cannot change publish behaviour on
      # an unrelated day.
      #
      # The checks after it exist because every way this goes wrong fails as a 404 on
      # publish, which reads like a missing package rather than a broken credential.
      - name: Use an npm that can publish with OIDC
        if: steps.decide.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          NPM_V="$(npm -v)"
          echo "npm $NPM_V"

          # The global install has to be the npm this shell actually resolves.
          MAJOR="${NPM_V%%.*}"
          REST="${NPM_V#*.}"
          MINOR="${REST%%.*}"
          if [ "$MAJOR" -lt 11 ] || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -lt 5 ]; }; then
            echo "::error::npm $NPM_V cannot do trusted publishing; 11.5.1 or newer is needed."
            exit 1
          fi

          # Set only when the job was granted id-token: write. Without it there is no OIDC
          # token to exchange and npm would fall back to publishing unauthenticated.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token available — the job is missing id-token: write."
            exit 1
          fi

          # Any _authToken at all, even an empty one, is presented instead of doing the
          # OIDC exchange. This is what a stray registry-url on setup-node leaves behind.
          if [ -f .npmrc ] && grep -q '_authToken' .npmrc; then
            echo "::error::.npmrc carries an _authToken line, which suppresses OIDC:"
            grep -n '_authToken' .npmrc
            exit 1
          fi
          echo "Ready to publish with OIDC."

      - name: Publish to npm
        if: steps.decide.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "watsmytask@$VERSION" version >/dev/null 2>&1; then
            echo "watsmytask@$VERSION is already on npm — nothing to publish."
            exit 0
          fi
          # No token: npm exchanges this job's OIDC identity for a short-lived credential
          # and attaches a provenance attestation.
          if ! npm publish --access public; then
            echo "::error::npm rejected the publish."
            echo
            echo "The preflight above already confirmed the three things this side controls:"
            echo "npm is new enough, an OIDC token is available, and no auth token is"
            echo "suppressing it. So npm asked the registry to accept this job's identity and"
            echo "the registry declined. Both ENEEDAUTH and a 404 on PUT mean that; neither"
            echo "means the package is missing."
            echo
            echo "On npmjs.com, on the watsmytask package:"
            echo "  Settings > Trusted Publisher > GitHub Actions"
            echo "    Organization or user: ${GITHUB_REPOSITORY%%/*}"
            echo "    Repository:           ${GITHUB_REPOSITORY##*/}"
            echo "    Workflow filename:    release.yml     (the file name, not the job)"
            echo "    Environment:          (leave empty)"
            echo
            echo "  Settings > Publishing access"
            echo "    must NOT be 'Require two-factor authentication'. That setting blocks"
            echo "    every automated publish, trusted publishing included. Either of the"
            echo "    other two options allows it."
            echo
            # The npm debug log records whether an OIDC exchange was attempted at all,
            # which is the one thing the error code above does not distinguish.
            LOG="$(ls -t "${HOME}/.npm/_logs/"*-debug-0.log 2>/dev/null | head -1 || true)"
            if [ -n "$LOG" ]; then
              echo "--- npm debug log, lines mentioning auth or OIDC ---"
              grep -iE 'oidc|id-token|trusted|audience|ENEEDAUTH|401|403|404' "$LOG" | tail -25 || true
              echo "--- end ---"
            fi
            exit 1
          fi

      - name: Create the release
        id: create
        if: steps.decide.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.decide.outputs.version }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail

          # The asset name is stable on purpose. The homepage links to
          # /releases/latest/download/watsmytask-installer.zip, which GitHub only
          # resolves while the asset is named exactly that.
          if [ ! -f release/watsmytask-installer.zip ]; then
            echo "::error::release/watsmytask-installer.zip is missing."
            exit 1
          fi

          # Release notes are the standing template with this version's CHANGELOG
          # section dropped into it, so the notes say what actually changed rather than
          # repeating the same blurb every time. A version with no section in the
          # changelog simply ships without a "what's new" rather than failing the release.
          NOTES=".github/release-notes.md"
          : > /tmp/whats-new.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              $0 ~ "^## " v "([ \t]|$)" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > /tmp/whats-new.md
          fi
          if [ -s /tmp/whats-new.md ]; then
            echo "Release notes will include the CHANGELOG section for $VERSION."
          else
            echo "::warning::No CHANGELOG.md section for $VERSION — notes will not say what changed."
          fi

          if [ -f "$NOTES" ]; then
            sed "s/__VERSION__/$VERSION/g" "$NOTES" |
              awk '
                /__WHATS_NEW__/ {
                  while ((getline line < "/tmp/whats-new.md") > 0) print line
                  next
                }
                { print }
              ' > /tmp/notes.md
          else
            echo "watsmytask $VERSION" > /tmp/notes.md
            cat /tmp/whats-new.md >> /tmp/notes.md
          fi

          # --target creates the tag at this commit when it does not already exist,
          # which is what makes the merge-to-main path work without a manual tag.
          gh release create "$TAG" \
            --title "watsmytask $VERSION" \
            --notes-file /tmp/notes.md \
            --target "$GITHUB_SHA" \
            release/watsmytask-installer.zip

          echo "Released $TAG"
          echo "Installer: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/watsmytask-installer.zip"

      # A skipped release looks identical to a successful one from the outside: a green
      # tick and an artifact. Say which it was, where anyone actually looks. Last, and
      # reading the release step's real outcome, so it reports rather than predicts.
      - name: Summarise what this run did
        if: always() && steps.decide.outputs.version != ''
        run: |
          set -euo pipefail
          V="${{ steps.decide.outputs.version }}"
          {
            if [ "${{ steps.create.outcome }}" = "success" ]; then
              echo "## Released watsmytask $V"
              echo
              echo "- npm: https://www.npmjs.com/package/watsmytask/v/$V"
              echo "- Installer: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/watsmytask-installer.zip"
            elif [ "${{ steps.decide.outputs.should_release }}" = "true" ]; then
              echo "## watsmytask $V was NOT released"
              echo
              echo "This run meant to release and did not get there. Nothing was published"
              echo "and no release was created, so the version is still free to retry."
              echo "See the failed step above for what stopped it."
            else
              echo "## Nothing was released"
              echo
              echo "Built watsmytask $V and attached the zip to this run. **No npm publish"
              echo "and no GitHub release.**"
              echo
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                echo "This was a manual run without the **release** box ticked."
                echo "Re-run it with that box ticked to publish."
              else
                echo "A release for \`v$V\` already exists. Bump the version in"
                echo "\`package.json\` to ship something new."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
