# avengers-12 — the only file you have to change.
#
# Project: Smart-Task-Planner. A local task planner whose database is a folder of
# markdown files, plus an optional local-AI chat plugin.
#
# Spec: plan.md (authoritative). plan_compact.md is a superseded idea bank — do NOT
# implement from it.
#
# Stack (see plan.md §4): TypeScript everywhere.
#   src/server/   Node + Hono, vault/tools/ai layers
#   src/web/      React + Vite
#   src/shared/   the contract between them
# One package.json, one build, one test command.

version: 1

# --- the gate --------------------------------------------------------------
# Checked AFTER the agent finishes and BEFORE anything is pushed. The agent is
# never asked whether it behaved; the diff is inspected.
gate:
  # Paths a run may never touch.
  deny:
    # --- the harness itself -------------------------------------------------
    - ".github/**"
    - ".claude/**"
    - "avengers-12/**"

    # --- house rules and the specs. Read, never rewritten --------------------
    # A run that can edit its own requirements has no requirements.
    - "CLAUDE.md"
    - "AGENTS.md"
    - "plan.md"
    - "plan_compact.md"
    - "README.md"

    # --- secrets ------------------------------------------------------------
    - ".env"
    - ".env.*"
    - "**/secrets/**"
    - "**/credentials/**"
    - "**/*.pem"
    - "**/*.key"

    # --- build infrastructure -----------------------------------------------
    # `npm ci` installs exactly what the lockfile says, so a dependency change
    # decides what "the build passed" even means. That is a human decision, made
    # in a normal PR. Same reasoning for the configs that define the build.
    - "package.json"
    - "package-lock.json"
    - "tsconfig.json"
    - "vite.config.ts"
    - "vitest.config.ts"

    # --- everything no verify step below covers -----------------------------
    # Only src/ is built and tested. Anything else can be changed by a run that
    # then reports green having proved nothing.
    - "*.md"
    - "*.yml"
    - "*.yaml"
    - "*.json"
    - ".gitignore"
    - ".gitattributes"
    - "docs/**"
    - "scripts/**"
    - ".vscode/**"
    - ".idea/**"

  # A change touching more than this many files is not "one fix per run".
  maxFilesChanged: 40

  # Paths allowed even though a deny pattern above matches them.
  # Evaluated before deny; first match wins.
  allow: []

# --- how a change proves itself --------------------------------------------
# One step, because there is one build. `tsc --noEmit && vite build` typechecks
# server and web together, then `vitest run` (non-watch — a watch-mode script
# would hang the runner until the job times out).
verify:
  - name: build-and-test
    run: npm ci && npm run build && npm test
    when: "src/**"

# --- where tests go ---------------------------------------------------------
# Tests live beside the code they test, which is why `directory` is the source
# root rather than a separate tree. Every *.test.ts under src/ is run by the
# verify step above.
tests:
  directory: src
  example: src/server/vault/derive.test.ts
  notRun: []

# --- what the runner needs before verify ------------------------------------
runtime:
  node: "22"
  cache:
    - ~/.npm
  cacheKeyFiles:
    - "package-lock.json"
  chmod: []

# --- what the coder may and may not do --------------------------------------
# Write/Edit denies are NOT listed here — every path in gate.deny above is
# turned into a Write() and an Edit() deny automatically by
# avengers-12/lib/emit-settings.sh.
permissions:
  # The build tools named in verify, and nothing else. Read-only git is already
  # allowed; git push, gh, curl and wget are already denied for everyone.
  #
  # curl/wget being denied matters here: the AI plugin downloads a runtime and a
  # model at *user* request, and no run should ever be fetching those itself.
  allowBash:
    - "npm:*"
    - "npx:*"
    - "node:*"

  # Paths the agent may not even READ.
  denyRead:
    - ".env"
    - ".env.*"
    - "**/secrets/**"
    - "**/credentials/**"
    - ".git/config"
    - "**/.git/**"

# --- advisory review --------------------------------------------------------
# Purely advisory: never blocks a run, never changes a verdict.
#
# Empty on purpose. The TypeScript reviewers worth naming are installed in the
# owner's local Claude Code, not in this repository, so they do not exist on the
# GitHub runner. Add a reviewer under .claude/agents/ first, then name it here.
review:
  agent: ""

# --- the soul folder --------------------------------------------------------
soul:
  directory: soul
  readNotes: 3

# --- house rules ------------------------------------------------------------
# Markdown the coder reads before it writes anything. Only files that exist.
#
# CLAUDE.md is short and points at plan.md. plan.md is ~300 lines and is
# deliberately NOT listed here — the relevant slice of it belongs in the issue,
# not read in full on every single run.
houseRules:
  - "CLAUDE.md"

# --- one-time bootstrap -----------------------------------------------------
# seed-board.sh turns `- [ ]` checklists into issues. plan.md's build order is a
# table, not checkboxes, so there is nothing to seed from.
seed:
  sources: []

# --- the board --------------------------------------------------------------
# `optional: true` = the loop runs on labels alone. Column names must match the
# GitHub Project exactly; a new Project has only Todo, In Progress and Done.
board:
  optional: true
  statusField: Status
  columns:
    todo: Todo
    inProgress: In Progress
    inReview: In Review
    blocked: Blocked
    done: Done

# --- labels -----------------------------------------------------------------
labels:
  prefix: "loop:"
  ready: "loop:ready"
  inProgress: "loop:in-progress"
  inReview: "loop:in-review"
  blocked: "loop:blocked"
  needsSpec: "loop:needs-spec"

# --- branches ---------------------------------------------------------------
branch:
  prefix: "loop/issue-"

# --- running on a timer -----------------------------------------------------
schedule:
  everyHours: 24

# --- caps -------------------------------------------------------------------
# maxRunsPerDay applies to SCHEDULED runs only.
budget:
  maxRunsPerDay: 2
  maxAttemptsPerRun: 3
  staleClaimHours: 2
  priorFilesMax: 200

# --- models -----------------------------------------------------------------
models:
  triage:
    model: claude-sonnet-5
    effort: medium
    maxTurns: 30
  implement:
    model: claude-opus-5
    effort: high
    maxTurns: 80

# --- where the harness keeps things ----------------------------------------
paths:
  state: avengers-12/state/STATE.md
  runLog: avengers-12/state/run-log.md
  rules: avengers-12/rules
  settings: avengers-12/settings
  lib: avengers-12/lib

# --- git identity used for harness commits ---------------------------------
git:
  userName: avengers-12-loop
  userEmail: loop@users.noreply.github.com
